"use strict";
/* ---------- Icons (inline SVG, zero deps) ---------- */
const IC={edit:'M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z',split:'M3 5h18v14H3zM12 5v14',eye:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12zM12 9a3 3 0 100 6 3 3 0 000-6z',sun:'M12 17a5 5 0 100-10 5 5 0 000 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4',moon:'M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z',code:'M16 18l6-6-6-6M8 6l-6 6 6 6',h:'M6 4v16M18 4v16M6 12h12',bold:'M6 4h8a4 4 0 010 8H6zM6 12h9a4 4 0 010 8H6z',italic:'M19 4h-9M14 20H5M15 4L9 20',strike:'M16 4H9a3 3 0 00-2.8 4M14 12a4 4 0 010 8H6M4 12h16',block:'M8 3H5a2 2 0 00-2 2v14a2 2 0 002 2h3M16 3h3a2 2 0 012 2v14a2 2 0 01-2 2h-3M9 9l-2 3 2 3M15 9l2 3-2 3',link:'M10 13a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.7 1.7M14 11a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.7-1.7',image:'M3 3h18v18H3zM8.5 10a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM21 15l-5-5L5 21',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',olist:'M10 6h11M10 12h11M10 18h11M4 6h1v4M4 10h2M6 18H4c0-1 2-2 2-3s-1-1.5-2-1',check:'M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11',quote:'M3 21c3 0 7-1 7-8V5H3v8h4M14 21c3 0 7-1 7-8V5h-7v8h4',minus:'M5 12h14',table:'M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18',copy:'M9 9h11v11H9zM5 15V5a1 1 0 011-1h10',trash:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6',type:'M4 7V4h16v3M9 20h6M12 4v16',clock:'M12 22a10 10 0 100-20 10 10 0 000 20zM12 6v6l4 2',zap:'M13 2L3 14h9l-1 8 10-12h-9z',cloud:'M18 10h-1.3A8 8 0 109 20h9a5 5 0 000-10z'};

/* ---------- Markdown engine (regex-based, XSS-safe) ---------- */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const HL=/(\/\/.*|\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|class|new|async|await|try|catch|throw|true|false|null|undefined)\b|\b(\d+\.?\d*)\b/g;
function highlight(code){
  let out='',last=0,m;HL.lastIndex=0;
  while((m=HL.exec(code))){
    out+=esc(code.slice(last,m.index));
    out+=`<span class="t-${m[1]?'c':m[2]?'s':m[3]?'k':'n'}">${esc(m[0])}</span>`;
    last=HL.lastIndex;
  }
  return out+esc(code.slice(last));
}
function inline(raw){
  const codes=[];
  let s=esc(raw).replace(/`([^`]+)`/g,(_,c)=>`\u0000${codes.push(c)-1}\u0000`);
  s=s.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">')
     .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
     .replace(/\*\*(.+?)\*\*|__(.+?)__/g,(_,a,b)=>`<strong>${a||b}</strong>`)
     .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\*)/g,'$1<em>$2</em>')
     .replace(/(^|[^_\w])_(?!\s)([^_]+?)_(?!\w)/g,'$1<em>$2</em>')
     .replace(/~~(.+?)~~/g,'<del>$1</del>');
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<code>${codes[i]}</code>`);
}
const LI=/^\s*([-*+]|\d+\.)\s+/, ROW=/^\|.*\|\s*$/, SEP=/^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
function parse(md){
  const L=md.replace(/\r/g,'').split('\n'),o=[];let i=0,m;
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){
      const lang=l.slice(3).trim(),b=[];i++;
      while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;
      const body=b.join('\n');
      o.push(`<pre data-lang="${esc(lang)}"><code>${/^(js|javascript|ts|typescript|json)$/i.test(lang)?highlight(body):esc(body)}</code></pre>`);continue;
    }
    if((m=l.match(/^(#{1,6})\s+(.*?)\s*#*$/))){o.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){o.push('<hr>');i++;continue}
    if(/^>/.test(l)){const b=[];while(i<L.length&&/^>/.test(L[i]))b.push(L[i++].replace(/^>\s?/,''));o.push(`<blockquote>${parse(b.join('\n'))}</blockquote>`);continue}
    if(ROW.test(l)&&SEP.test(L[i+1]||'')){
      const h=cells(l);i+=2;const rows=[];
      while(i<L.length&&ROW.test(L[i]))rows.push(cells(L[i++]));
      o.push(`<div class="tw"><table><thead><tr>${h.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);continue;
    }
    if(LI.test(l)){
      const ord=/^\s*\d+\./.test(l),items=[];
      while(i<L.length&&LI.test(L[i])){
        const t=L[i++].replace(LI,''),k=t.match(/^\[([ xX])\]\s+(.*)/);
        items.push(k?`<li class="task"><input type="checkbox" disabled${k[1]!==' '?' checked':''}>${inline(k[2])}</li>`:`<li>${inline(t)}</li>`);
      }
      o.push(ord?`<ol>${items.join('')}</ol>`:`<ul>${items.join('')}</ul>`);continue;
    }
    if(!l.trim()){i++;continue}
    const p=[];
    while(i<L.length&&L[i].trim()&&!/^(```|#{1,6}\s|>|(-{3,}|\*{3,})\s*$)/.test(L[i])&&!LI.test(L[i]))p.push(L[i++]);
    if(!p.length){p.push(L[i++])}
    o.push(`<p>${p.map(inline).join('<br>')}</p>`);
  }
  return o.join('\n');
}

const debounce=(fn,ms=120)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch{return false}}};

function stats(){

/* scroll sync */
let lock=false;
ed.addEventListener('scroll',()=>{

  lock=true;pv.scrollTop=ed.scrollTop/(ed.scrollHeight-ed.clientHeight)*(pv.scrollHeight-pv.clientHeight);

/* formatting actions */
function wrap(b,a=b,ph='text'){
  const s=ed.selectionStart,e=ed.selectionEnd,t=ed.value.slice(s,e)||ph;

function prefix(p){
  const s=ed.selectionStart,e=ed.selectionEnd,ls=ed.value.lastIndexOf('\n',s-1)+1;

  ed.setRangeText(seg,ls,e,'end');ed.focus();onInput();

/* view modes + theme */
$('views').addEventListener('click',e=>{
  const b=e.target.closest('button[data-v]');if(!b)return;
  $('main').dataset.view=b.dataset.v;
  document.querySelectorAll('#views button').forEach(x=>x.setAttribute('aria-pressed',x===b));
});
function setTheme(t){
  document.documentElement.dataset.theme=t;
  const s=$('theme').firstElementChild;s.dataset.ic=t==='dark'?'sun':'moon';paint();store.set('markflow:theme',t);
}
$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* init */
document.documentElement.dataset.theme=store.get('markflow:theme')||'dark';
paint();setTheme(document.documentElement.dataset.theme);
ed.value=store.get('markflow:doc')||SAMPLE;
render();
</script>
</body>
</html>
